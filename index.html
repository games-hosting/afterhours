
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101014">
<title>afterhours.</title>
<style>
:root {
  color-scheme: dark;
  --bg: #101014;
  --panel: #19191f;
  --text: #f4f2f7;
  --muted: #9996a4;
  --accent: #c8ff6b;
  --line: #303039;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 system-ui, sans-serif;
}
main { max-width: 760px; margin: auto; padding: 26px 18px 50px; }
.logo { font-size: 42px; font-weight: 850; letter-spacing: -2px; }
.logo span { color: var(--accent); }
.tag { color: var(--muted); font-size: 11px; letter-spacing: 2px; }
header { margin-bottom: 38px; }
h2 { font-size: 20px; margin-bottom: 6px; }
.muted, .intro { color: var(--muted); }
.intro { margin-bottom: 24px; }
.games { display: grid; grid-template-columns: repeat(2,1fr); gap: 9px; }
.tile {
  display: flex; align-items: center; gap: 12px;
  text-align: left; background: transparent;
  border: 1px solid var(--line); border-radius: 14px;
  color: var(--text); padding: 16px 12px; min-height: 72px;
}
.tile h3 { font-size: 15px; margin: 0; font-weight: 650; }
.emoji { font-size: 22px; }
button { font: inherit; cursor: pointer; }
button:active { opacity: .75; }
.hidden { display: none !important; }
.back { background: none; border: 0; color: var(--muted); padding: 8px 0 22px; }
.panel { margin-top: 10px; }
.display {
  display: grid; place-items: center; text-align: center;
  min-height: 190px; padding: 24px 8px;
  font-size: clamp(24px,6vw,34px); font-weight: 720;
  line-height: 1.25; overflow-wrap: anywhere;
}
.actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 16px 0; }
.action {
  border: 1px solid var(--line); border-radius: 999px;
  background: transparent; color: var(--text); padding: 10px 17px;
}
.primary { background: var(--accent); color: #151710; border-color: var(--accent); font-weight: 750; }
label { font-size: 13px; color: var(--muted); display: grid; gap: 7px; }
select {
  background: var(--panel); color: var(--text);
  border: 1px solid var(--line); border-radius: 12px; padding: 12px; width: 100%;
}
.field { margin: 10px 0 16px; }
.story {
  white-space: pre-wrap; overflow-wrap: anywhere;
  font-size: 17px; line-height: 1.65; margin: 20px 0; min-height: 90px;
}
.record {
  width: 78px; height: 78px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--panel);
  color: white; font-size: 27px; margin: 18px auto;
}
.record.on { background: #ff5364; border-color: #ff5364; }
.center { text-align: center; }
.small { font-size: 12px; color: var(--muted); }
.foot { margin-top: 38px; text-align: center; color: #66636f; font-size: 11px; }
@media (min-width: 560px) {
  .games { grid-template-columns: repeat(3,1fr); }
}
</style>
</head>
<body>
<main>
<header>
  <div class="logo">afterhours<span>.</span></div>
  <div class="tag">A LITTLE CHAOS, TOGETHER</div>
</header>

<section id="home">
  <h2>Pick your game.</h2>
  <p class="intro">One phone. Everyone in.</p>
  <div class="games">
    <button class="tile" onclick="openGame('bomb')"><span class="emoji">💣</span><h3>Bomb Pass</h3></button>
    <button class="tile" onclick="openGame('spy')"><span class="emoji">🕵️</span><h3>Spyfall-ish</h3></button>
    <button class="tile" onclick="openGame('undercover')"><span class="emoji">🎭</span><h3>Undercover</h3></button>
    <button class="tile" onclick="openGame('likely')"><span class="emoji">👉</span><h3>Most Likely To</h3></button>
    <button class="tile" onclick="openGame('wyr')"><span class="emoji">⚖️</span><h3>Would You Rather</h3></button>
    <button class="tile" onclick="openGame('quick')"><span class="emoji">⚡</span><h3>Quickfire</h3></button>
    <button class="tile" onclick="openGame('truth')"><span class="emoji">🫣</span><h3>Truth or Tale</h3></button>
    <button class="tile" onclick="openGame('story')"><span class="emoji">🎙️</span><h3>Story Studio</h3></button>
  </div>
</section>

<section id="game" class="hidden">
  <button class="back" onclick="goHome()">← all games</button>
  <div class="panel">
    <h2 id="gameTitle"></h2>
    <p id="gameDesc" class="muted"></p>
    <div id="gameBody"></div>
  </div>
</section>
<div class="foot">made for your favourite people.</div>
</main>

<script>
const $ = id => document.getElementById(id);
const random = arr => arr[Math.floor(Math.random() * arr.length)];

const prompts = {
  likely: [
    "Who would accidentally become famous?",
    "Who would survive longest in a zombie movie?",
    "Who would text the wrong person?",
    "Who would get lost using maps?",
    "Who would laugh at the worst possible moment?",
    "Who would become a millionaire and disappear?",
    "Who would be the worst secret keeper?",
    "Who would make friends with an alien?",
    "Who would start drama by accident?",
    "Who would be late to their own wedding?"
  ],
  wyr: [
    "Never use music again or never watch films again?",
    "Read minds or see ten minutes into the future?",
    "Unlimited snacks or unlimited holidays?",
    "Be famous for something embarrassing or unknown for something amazing?",
    "Only whisper or only shout for a day?",
    "Always be ten minutes late or thirty minutes early?",
    "Give up your favourite app or your favourite food?",
    "Live underwater or in space for a month?"
  ],
  quick: [
    "Name a food you could eat every day.",
    "What's a tiny thing that instantly annoys you?",
    "Name a fictional world you'd visit.",
    "What's your most-used emoji?",
    "What song would play when you enter a room?",
    "What's a skill you wish you had?",
    "What's an underrated snack?",
    "Describe your vibe in three words."
  ],
  truth: [
    "What's a harmless lie you told as a kid?",
    "What's the most random thing in your camera roll?",
    "What's a moment you still cringe about?",
    "What's something everyone loves but you don't get?",
    "What's the funniest misunderstanding you've had?",
    "What's a talent nobody expects you to have?"
  ],
  locations: [
    "airport", "aquarium", "movie set", "school",
    "wedding", "space station", "hospital", "theme park",
    "museum", "restaurant"
  ],
  words: [
    ["coffee","tea"], ["ocean","lake"], ["tiger","lion"],
    ["pancake","waffle"], ["train","bus"], ["guitar","piano"],
    ["winter","summer"], ["castle","palace"]
  ]
};

let recognition = null;
let recording = false;
let story = "";

function openGame(name) {
  stopRecording();
  $("home").classList.add("hidden");
  $("game").classList.remove("hidden");
  $("gameBody").innerHTML = "";

  const config = {
    bomb: ["Bomb Pass", "Pass the phone before the timer ends."],
    spy: ["Spyfall-ish", "Ask questions and figure out who the spy is."],
    undercover: ["Undercover", "Find who has the different word."],
    likely: ["Most Likely To", "Read it out and point on three."],
    wyr: ["Would You Rather", "Pick a side."],
    quick: ["Quickfire", "Answer without overthinking."],
    truth: ["Truth or Tale", "Tell a story. Everyone guesses if it's true."],
    story: ["Story Studio", "Build a story together using your voice."]
  }[name];

  $("gameTitle").textContent = config[0];
  $("gameDesc").textContent = config[1];

  ({
    bomb: setupBomb,
    spy: setupSpy,
    undercover: setupUndercover,
    likely: () => setupPrompt(prompts.likely),
    wyr: () => setupPrompt(prompts.wyr),
    quick: () => setupPrompt(prompts.quick),
    truth: () => setupPrompt(prompts.truth),
    story: setupStory
  })[name]();
}

function goHome() {
  stopRecording();
  $("game").classList.add("hidden");
  $("home").classList.remove("hidden");
}

function setupBomb() {
  $("gameBody").innerHTML = `
    <div class="display" id="bombDisplay">Ready?</div>
    <div class="actions"><button class="action primary" id="bombStart">Start</button></div>
    <p class="small center">The timer is random. Pass it fast.</p>`;

  $("bombStart").onclick = () => {
    let seconds = 8 + Math.floor(Math.random() * 23);
    $("bombStart").disabled = true;
    const end = Date.now() + seconds * 1000;
    $("bombDisplay").textContent = "PASS IT!";
    if (navigator.vibrate) navigator.vibrate(100);

    const timer = setInterval(() => {
      const left = Math.max(0, Math.ceil((end - Date.now()) / 1000));
      $("bombDisplay").textContent = left ? left : "💥 BOOM!";
      if (!left) {
        clearInterval(timer);
        $("bombStart").disabled = false;
        $("bombStart").textContent = "Again";
        if (navigator.vibrate) navigator.vibrate([180, 90, 250]);
      }
    }, 250);
  };
}

function setupPrompt(list) {
  $("gameBody").innerHTML = `
    <div class="display" id="promptDisplay">Ready?</div>
    <div class="actions"><button class="action primary" id="nextPrompt">Next</button></div>`;
  $("nextPrompt").onclick = () => {
    $("promptDisplay").textContent = random(list);
  };
}

function setupSpy() {
  $("gameBody").innerHTML = `
    <label class="field">Players
      <select id="spyPlayers">${options(3,20,5)}</select>
    </label>
    <div class="display" id="spyCard">Pass the phone privately.</div>
    <div class="actions">
      <button class="action primary" id="spyReveal">Reveal role</button>
      <button class="action" id="spyNext">Next</button>
    </div>
    <p class="small center" id="spyStatus">Player 1</p>`;

  let player = 1, spy = 1, location = "";
  function newRound() {
    player = 1;
    location = random(prompts.locations);
    spy = 1 + Math.floor(Math.random() * Number($("spyPlayers").value));
    $("spyCard").textContent = "Pass the phone privately.";
    $("spyStatus").textContent = "Player 1";
  }
  $("spyReveal").onclick = () => {
    $("spyCard").textContent = player === spy
      ? "🕵️ You are the spy."
      : "📍 " + location;
  };
  $("spyNext").onclick = () => {
    player++;
    if (player > Number($("spyPlayers").value)) return newRound();
    $("spyCard").textContent = "Pass the phone privately.";
    $("spyStatus").textContent = "Player " + player;
  };
  $("spyPlayers").onchange = newRound;
  newRound();
}

function setupUndercover() {
  $("gameBody").innerHTML = `
    <label class="field">Players
      <select id="uPlayers">${options(3,20,5)}</select>
    </label>
    <div class="display" id="uCard">Pass the phone privately.</div>
    <div class="actions">
      <button class="action primary" id="uReveal">Reveal word</button>
      <button class="action" id="uNext">Next</button>
    </div>
    <p class="small center" id="uStatus">Player 1</p>`;

  let roles = [], player = 0;
  function newRound() {
    const count = Number($("uPlayers").value);
    const pair = random(prompts.words);
    roles = Array(count).fill(pair[0]);
    roles[Math.floor(Math.random() * count)] = pair[1];
    player = 0;
    $("uStatus").textContent = `Player 1 of ${count}`;
    $("uCard").textContent = "Pass the phone privately.";
  }
  $("uReveal").onclick = () => {
    $("uCard").textContent = roles[player] || "Round over!";
  };
  $("uNext").onclick = () => {
    player++;
    if (player >= roles.length) {
      $("uCard").textContent = "Discuss! Who is undercover?";
      $("uStatus").textContent = "Round over";
      return;
    }
    $("uCard").textContent = "Pass the phone privately.";
    $("uStatus").textContent = `Player ${player + 1} of ${roles.length}`;
  };
  $("uPlayers").onchange = newRound;
  newRound();
}

function options(min, max, selected) {
  return Array.from({length:max-min+1}, (_,i) => {
    const n = min+i;
    return `<option ${n===selected?"selected":""}>${n}</option>`;
  }).join("");
}

function stopRecording() {
  recording = false;
  if (recognition) {
    const old = recognition;
    recognition = null;
    try { old.stop(); } catch(e) {}
  }
  const button = $("recordBtn");
  if (button) {
    button.classList.remove("on");
    button.textContent = "🎙️";
  }
}

function setupStory() {
  $("gameBody").innerHTML = `
    <div class="row field" style="display:flex;gap:12px">
      <label style="flex:1">Language
        <select id="storyLang">
          <option value="en-US">English</option>
          <option value="sv-SE">Svenska</option>
        </select>
      </label>
      <label style="flex:1">Vibe
        <select id="storyVibe">
          <option value="mystery">Mystery / Mysterium</option>
          <option value="fantasy">Fantasy</option>
          <option value="comedy">Comedy / Komedi</option>
          <option value="scifi">Sci-fi</option>
        </select>
      </label>
    </div>
    <div class="story" id="storyText"></div>
    <div class="center">
      <button class="record" id="recordBtn" aria-label="Start recording">🎙️</button>
      <div class="small" id="recordStatus">Tap the mic to start recording.</div>
    </div>
    <div class="actions">
      <button class="action" id="ideaBtn">Story twist</button>
      <button class="action" id="readBtn">Read aloud</button>
      <button class="action" id="clearBtn">Restart</button>
    </div>
    <p class="small center">Tap the mic again to stop. Recognized speech is added automatically.</p>`;

  story = $("storyLang").value === "sv-SE"
    ? "Det var en gång…"
    : "Once upon a time…";
  renderStory();

  const ideas = {
    "en-US": {
      mystery: ["A locked door opens by itself.", "Someone leaves a note with your name.", "The clock stops at midnight."],
      fantasy: ["A tiny dragon asks for a favour.", "The map changes as you look at it.", "A spell works—but not as expected."],
      comedy: ["The villain is allergic to their own plan.", "Everyone suddenly speaks in rhymes.", "A chicken becomes mayor."],
      scifi: ["A message arrives from tomorrow.", "The ship AI starts telling jokes.", "A new planet has your exact street."]
    },
    "sv-SE": {
      mystery: ["En låst dörr öppnas av sig själv.", "Någon lämnar en lapp med ditt namn.", "Klockan stannar vid midnatt."],
      fantasy: ["En liten drake ber om hjälp.", "Kartan ändras medan du tittar på den.", "En förtrollning fungerar – men inte som väntat."],
      comedy: ["Skurken är allergisk mot sin egen plan.", "Alla börjar plötsligt prata på rim.", "En höna blir borgmästare."],
      scifi: ["Ett meddelande kommer från morgondagen.", "Rymdskeppets AI börjar dra skämt.", "En ny planet har exakt din gata."]
    }
  };

  $("recordBtn").onclick = () => recording ? stopRecording() : startRecording();
  $("storyLang").onchange = () => {
    stopRecording();
    story = $("storyLang").value === "sv-SE"
      ? "Det var en gång…"
      : "Once upon a time…";
    renderStory();
    $("recordStatus").textContent = "Language changed. Tap the mic to start.";
  };
  $("ideaBtn").onclick = () => {
    story += " " + random(ideas[$("storyLang").value][$("storyVibe").value]);
    renderStory();
  };
  $("readBtn").onclick = () => {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(story);
    utterance.lang = $("storyLang").value;
    speechSynthesis.speak(utterance);
  };
  $("clearBtn").onclick = () => {
    stopRecording();
    story = $("storyLang").value === "sv-SE"
      ? "Det var en gång…"
      : "Once upon a time…";
    renderStory();
  };
}

function renderStory() {
  const el = $("storyText");
  if (el) el.textContent = story;
}

function startRecording() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    $("recordStatus").textContent =
      "Speech-to-text isn't supported here. Try Chrome, or use Story Twist.";
    return;
  }

  try {
    recognition = new SpeechRecognition();
    recognition.lang = $("storyLang").value;
    recognition.continuous = true;
    recognition.interimResults = false;
    recording = true;

    $("recordBtn").classList.add("on");
    $("recordBtn").textContent = "■";
    $("recordStatus").textContent = "Listening… tap the button to stop.";

    recognition.onresult = event => {
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) {
          const words = event.results[i][0].transcript.trim();
          if (words) {
            story += " " + words;
            renderStory();
          }
        }
      }
    };

    recognition.onerror = event => {
      if (event.error === "not-allowed" || event.error === "service-not-allowed") {
        $("recordStatus").textContent =
          "Microphone blocked. Allow mic access in Chrome site settings.";
        stopRecording();
      } else if (event.error === "no-speech") {
        $("recordStatus").textContent = "Listening… say something when ready.";
      }
    };

    recognition.onend = () => {
      if (recording && recognition) {
        try { recognition.start(); }
        catch(e) { stopRecording(); }
      }
    };

    recognition.start();
  } catch (error) {
    stopRecording();
    $("recordStatus").textContent =
      "Couldn't start voice input. Try Chrome and check microphone permission.";
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101014">
<title>afterhours.</title>
<style>
:root{color-scheme:dark;--bg:#101014;--panel:#19191f;--panel2:#22222b;--text:#f4f2f7;--muted:#a5a2b0;--accent:#c8ff6b;--line:#34343e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#252333 0,#101014 48%);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
main{width:min(900px,100%);margin:auto;padding:24px 16px 56px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px}.logo{font-size:clamp(27px,6vw,42px);font-weight:850;letter-spacing:-2px}.logo span{color:var(--accent)}.tag{color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase}
h1,h2,h3,p{margin-top:0}h2{font-size:22px;letter-spacing:-.5px}h3{margin-bottom:8px}.intro{color:var(--muted);max-width:560px}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:22px 0 34px}.tile,.panel{background:rgba(25,25,31,.92);border:1px solid var(--line);border-radius:18px;padding:18px}.tile{cursor:pointer;text-align:left;color:inherit;transition:transform .15s,border-color .15s}.tile:hover,.tile:focus-visible{transform:translateY(-2px);border-color:var(--accent);outline:none}.emoji{font-size:25px;margin-bottom:13px}.tile p{color:var(--muted);font-size:14px;margin:5px 0 0}.panel{margin-top:14px}.hidden{display:none!important}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.stack{display:grid;gap:12px}.btn,button,select,input,textarea{font:inherit}.btn,button{border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--text);padding:11px 15px;cursor:pointer}.primary{background:var(--accent);color:#151710;border-color:var(--accent);font-weight:750}.btn:disabled,button:disabled{opacity:.5;cursor:not-allowed}select,input,textarea{background:#111116;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}label{font-size:13px;color:var(--muted);display:grid;gap:6px}.field{min-width:130px;flex:1}.display{background:#101015;border:1px solid var(--line);border-radius:14px;padding:22px;min-height:100px;display:grid;place-items:center;text-align:center;font-size:clamp(19px,4vw,28px);font-weight:700;margin:12px 0}.muted{color:var(--muted)}.small{font-size:13px}.pill{display:inline-block;border:1px solid var(--line);padding:5px 9px;border-radius:99px;color:var(--muted);font-size:12px}.back{background:transparent}.foot{margin-top:34px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body><main>
<header class="top"><div><div class="logo">afterhours<span>.</span></div><div class="tag">a little chaos, together</div></div><span class="pill">PASS THE PHONE</span></header>
<section id="home">
<h2>Pick your game.</h2><p class="intro">One phone, a group of people, and absolutely no need to be normal about it.</p>
<div class="games">
<button class="tile" onclick="openGame('bomb')"><div class="emoji">💣</div><h3>Bomb Pass</h3><p>Pass it around before the timer runs out.</p></button>
<button class="tile" onclick="openGame('spy')"><div class="emoji">🕵️</div><h3>Spyfall-ish</h3><p>One spy. One secret location. Ask questions.</p></button>
<button class="tile" onclick="openGame('undercover')"><div class="emoji">🎭</div><h3>Undercover</h3><p>Find the odd word out.</p></button>
<button class="tile" onclick="openGame('likely')"><div class="emoji">👉</div><h3>Most Likely To</h3><p>Point fingers. Defend your honour.</p></button>
<button class="tile" onclick="openGame('wyr')"><div class="emoji">⚖️</div><h3>Would You Rather</h3><p>Two options, zero easy answers.</p></button>
<button class="tile" onclick="openGame('quick')"><div class="emoji">⚡</div><h3>Quickfire</h3><p>Answer fast. No overthinking.</p></button>
<button class="tile" onclick="openGame('truth')"><div class="emoji">🫣</div><h3>Truth or Tale</h3><p>Tell a story. The group guesses if it's true.</p></button>
<button class="tile" onclick="openGame('story')"><div class="emoji">🎙️</div><h3>Story Studio</h3><p>Make a story together with voice or text.</p></button>
</div></section>
<section id="game" class="hidden">
<div class="row" style="justify-content:space-between"><button class="back" onclick="goHome()">← All games</button><span class="pill" id="gameTag">GAME</span></div>
<div class="panel"><h2 id="gameTitle">Game</h2><p id="gameDesc" class="muted"></p><div id="gameBody"></div></div>
</section>
<div class="foot">Made for the group chat that became a real-life hangout.</div>
</main>
<script>
const $=id=>document.getElementById(id);
const prompts={
likely:["Who would accidentally become famous?","Who would survive longest in a zombie movie?","Who is most likely to text the wrong person?","Who would get lost using maps?","Who would laugh at the worst possible moment?","Who would become a millionaire and disappear?","Who would be the worst secret keeper?","Who would make friends with an alien?","Who would start drama by accident?","Who would be late to their own wedding?"],
wyr:["Never use music again or never watch films again?","Read minds or see ten minutes into the future?","Have unlimited snacks or unlimited holidays?","Be famous for something embarrassing or unknown for something amazing?","Only whisper or only shout for a day?","Always be ten minutes late or thirty minutes early?","Give up your favourite app or your favourite food?","Live underwater or in space for a month?"],
quick:["Name a food you could eat every day.","What's a tiny thing that instantly annoys you?","Name a fictional world you'd visit.","What's your most-used emoji?","What song would play when you enter a room?","What's a skill you wish you had?","What's an underrated snack?","Describe your vibe in three words."],
truth:["What's a harmless lie you told as a kid?","What's the most random thing in your camera roll?","What's a moment you still cringe about?","What's something everyone loves but you don't get?","What's the funniest misunderstanding you've had?","What's a talent nobody expects you to have?"],
locations:["airport","aquarium","movie set","school","wedding","space station","hospital","theme park","museum","restaurant"],
words:[["coffee","tea"],["ocean","lake"],["tiger","lion"],["pancake","waffle"],["train","bus"],["guitar","piano"],["winter","summer"],["castle","palace"]]
};
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function openGame(name){$('home').classList.add('hidden');$('game').classList.remove('hidden');$('gameBody').innerHTML='';const configs={bomb:['💣 Bomb Pass','Keep passing the phone. When the timer ends, whoever holds it loses.'],spy:['🕵️ Spyfall-ish','Everyone sees the same location except the spy. Ask questions without giving it away.'],undercover:['🎭 Undercover','Pass the phone and secretly check your word. Most players share a word; one player gets a similar one.'],likely:['👉 Most Likely To','Read a prompt and everyone points at someone on three.'],wyr:['⚖️ Would You Rather','Pick a side and argue your case.'],quick:['⚡ Quickfire','Answer the prompt before the group counts down.'],truth:['🫣 Truth or Tale','Tell a story inspired by the prompt. Everyone guesses if it really happened.'],story:['🎙️ Story Studio','Build a shared story, one turn at a time.']};$('gameTag').textContent=name.toUpperCase();$('gameTitle').textContent=configs[name][0];$('gameDesc').textContent=configs[name][1];({bomb:setupBomb,spy:setupSpy,undercover:setupUndercover,likely:()=>setupPrompt('likely',prompts.likely),wyr:()=>setupPrompt('wyr',prompts.wyr),quick:()=>setupPrompt('quick',prompts.quick),truth:()=>setupPrompt('truth',prompts.truth),story:setupStory}[name])()}
function goHome(){$('game').classList.add('hidden');$('home').classList.remove('hidden')}
function setupBomb(){ $('gameBody').innerHTML=`<div class="row"><label class="field">Timer min (seconds)<input id="bmin" type="number" value="10" min="5" max="60"></label><label class="field">Timer max (seconds)<input id="bmax" type="number" value="30" min="6" max="90"></label></div><div class="display" id="bombDisplay">Ready?</div><button class="primary" id="bombStart">Start timer</button><p class="muted small">Keep the phone moving. Sound and vibration depend on your device.</p>`;$('bombStart').onclick=()=>{let min=Math.max(5,+$('bmin').value||10),max=Math.max(min,+$('bmax').value||30),secs=Math.floor(min+Math.random()*(max-min+1));$('bombStart').disabled=true;$('bombDisplay').textContent='PASS IT!';if(navigator.vibrate)navigator.vibrate(120);let end=Date.now()+secs*1000;let t=setInterval(()=>{let left=Math.max(0,Math.ceil((end-Date.now())/1000));$('bombDisplay').textContent=left+' seconds…';if(!left){clearInterval(t);$('bombDisplay').textContent='💥 BOOM!';if(navigator.vibrate)navigator.vibrate([200,100,300]);$('bombStart').disabled=false;$('bombStart').textContent='Play again';}},200)}}
function setupPrompt(type,list){$('gameBody').innerHTML=`<div class="display" id="promptDisplay">Ready?</div><div class="row"><button class="primary" id="nextPrompt">Get a prompt</button><button id="speakPrompt">🔊 Read aloud</button></div>`;$('nextPrompt').onclick=()=>{$('promptDisplay').textContent=rand(list)};$('speakPrompt').onclick=()=>{if('speechSynthesis'in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance($('promptDisplay').textContent))}}}
function setupSpy(){$('gameBody').innerHTML=`<label>Number of players<input id="spyPlayers" type="number" value="5" min="3" max="20"></label><label>Player viewing now<input id="spyTurn" type="number" value="1" min="1"></label><div class="display" id="spyCard">Set players, then reveal each role privately.</div><div class="row"><button class="primary" id="spyReveal">Reveal player 1</button><button id="spyNext">Hide / next player</button></div><p class="muted small">Pass the phone privately. The spy should not see the location.</p>`;let loc=rand(prompts.locations),spy=0;function update(){let n=Math.max(3,+$('spyPlayers').value||5);$('spyTurn').max=n;$('spyTurn').value=Math.min(n,Math.max(1,+$('spyTurn').value||1));$('spyCard').textContent='Ready to reveal';$('spyReveal').textContent='Reveal player '+$('spyTurn').value;spy=Math.floor(Math.random()*n)+1;loc=rand(prompts.locations)}$('spyPlayers').onchange=update;$('spyReveal').onclick=()=>{let n=Math.max(3,+$('spyPlayers').value||5),p=Math.min(n,Math.max(1,+$('spyTurn').value||1));$('spyCard').textContent=p===spy?'🕵️ You are the SPY!':'📍 Location: '+loc;$('spyReveal').textContent='Role revealed'};$('spyNext').onclick=()=>{let n=Math.max(3,+$('spyPlayers').value||5),p=+ $('spyTurn').value;if(p>=n){update();$('spyTurn').value=1}else $('spyTurn').value=p+1;$('spyCard').textContent='Pass to player '+$('spyTurn').value;$('spyReveal').textContent='Reveal player '+$('spyTurn').value};update()}
function setupUndercover(){$('gameBody').innerHTML=`<label>Number of players<input id="uPlayers" type="number" value="5" min="3" max="20"></label><label>Undercover players<input id="uCount" type="number" value="1" min="1" max="5"></label><div class="display" id="uCard">Start a round, then pass the phone privately.</div><div class="row"><button class="primary" id="uStart">New round</button><button id="uReveal">Reveal word</button><button id="uNext">Next player</button></div><p class="muted small" id="uStatus"></p>`;let roles=[],i=0;function start(){let n=Math.max(3,+$('uPlayers').value||5),c=Math.min(n-1,Math.max(1,+$('uCount').value||1)),pair=rand(prompts.words);roles=Array(n).fill(pair[0]);let ids=[...Array(n).keys()].sort(()=>Math.random()-.5).slice(0,c);ids.forEach(x=>roles[x]=pair[1]);i=0;$('uCard').textContent='Tap “Reveal word” for player 1';$('uStatus').textContent=`Player 1 of ${n}`};$('uStart').onclick=start;$('uReveal').onclick=()=>{$('uCard').textContent=roles[i]||'Start a new round';};$('uNext').onclick=()=>{i++;if(i>=roles.length){$('uCard').textContent='Everyone has seen their word. Discuss!';$('uStatus').textContent='Round ready for discussion.'}else{$('uCard').textContent='Pass the phone, then reveal';$('uStatus').textContent=`Player ${i+1} of ${roles.length}`}};start()}
function setupStory(){$('gameBody').innerHTML=`<div class="row"><label class="field">Language<select id="storyLang"><option value="en-US">English</option><option value="sv-SE">Svenska</option></select></label><label class="field">Story vibe<select id="storyVibe"><option value="mystery">Mystery</option><option value="fantasy">Fantasy</option><option value="comedy">Comedy</option><option value="scifi">Sci-fi</option></select></label></div><label>Story so far<textarea id="storyText" rows="5" placeholder="Your story begins here…"></textarea></label><div class="row"><button class="primary" id="storyTurn">Get next-turn idea</button><button id="storySpeak">🔊 Read story</button><button id="storyMic">🎙️ Enable microphone</button></div><p class="muted small" id="micStatus">Microphone is optional. Your browser will ask permission when you tap Enable microphone.</p><label>Your spoken turn (transcription where supported)<textarea id="storySpeech" rows="2" placeholder="Your turn will appear here if speech recognition is supported."></textarea></label><div class="row"><button id="storyListen">Start voice input</button><button id="storyAdd">Add turn to story</button></div><div class="display" id="storyIdea">Choose a vibe and start building your story.</div>`;let lang=()=>$('storyLang').value;const ideas={'en-US':{mystery:['A locked door opens by itself.','Someone leaves a note with your name.','The clock stops at exactly midnight.'],fantasy:['A tiny dragon asks for a favour.','The map changes while you look at it.','A spell works—but not as expected.'],comedy:['The villain is allergic to their own plan.','Everyone suddenly speaks in rhymes.','A chicken becomes the town mayor.'],'scifi':['A message arrives from tomorrow.','The ship’s AI starts telling jokes.','A new planet has your exact street.']},'sv-SE':{mystery:['En låst dörr öppnas av sig själv.','Någon lämnar en lapp med ditt namn.','Klockan stannar exakt vid midnatt.'],fantasy:['En liten drake ber om hjälp.','Kartan ändras medan du tittar på den.','En förtrollning fungerar—men inte som väntat.'],comedy:['Skurken är allergisk mot sin egen plan.','Alla börjar plötsligt prata på rim.','En höna blir stadens borgmästare.'],'scifi':['Ett meddelande kommer från morgondagen.','Rymdskeppets AI börjar dra skämt.','En ny planet har exakt din gata.']}};$('storyTurn').onclick=()=>{$('storyIdea').textContent=rand(ideas[lang()][$('storyVibe').value])};$('storySpeak').onclick=()=>{if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('storyText').value||$('storyIdea').textContent);u.lang=lang();speechSynthesis.speak(u)}};$('storyMic').onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Microphone access is not available here. Try opening this page from an HTTPS website.');let stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>t.stop());$('micStatus').textContent='Microphone permission granted. Tap “Start voice input” if your browser supports speech recognition.'}catch(e){$('micStatus').textContent='Could not enable microphone: '+e.message+' (On Android, local files may need to be hosted on HTTPS.)'}};$('storyListen').onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('micStatus').textContent='Speech-to-text is not supported by this browser. You can type your turn instead.';return}let r=new SR();r.lang=lang();r.interimResults=false;r.onresult=e=>$('storySpeech').value=e.results[0][0].transcript;r.onerror=e=>$('micStatus').textContent='Voice input error: '+e.error;r.start();$('micStatus').textContent='Listening… speak now.'};$('storyAdd').onclick=()=>{let t=$('storySpeech').value.trim();if(t){$('storyText').value=($('storyText').value.trim()?$('storyText').value.trim()+' ':'')+t;$('storySpeech').value='';$('storyIdea').textContent='Turn added! Keep going.'}}}
</script></body></html>
